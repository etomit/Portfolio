    <!-- Applique le thème avant le premier affichage : le plan bleu par défaut, le tirage papier si choisi. -->

        var theme
        try { theme = localStorage.getItem('portfolio-theme') } catch (error) { /* stockage indisponible */ }
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
      })()
    </script>
